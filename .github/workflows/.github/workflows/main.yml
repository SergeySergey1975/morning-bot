name: Morning Reminder

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install requests
        run: pip install requests
        
      - name: Run bot
        run: python bot.py
